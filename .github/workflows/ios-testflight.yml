# Builds the iOS app on a cloud Mac and uploads it to TestFlight.
#
# Run it manually from GitHub → Actions → "iOS · TestFlight" → Run workflow.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID          — your 10-character Team ID (developer.apple.com → Membership)
#   APPSTORE_ISSUER_ID     — App Store Connect → Users and Access → Integrations → App Store Connect API
#   APPSTORE_KEY_ID        — the key's ID from that same page
#   APPSTORE_P8            — the full contents of the downloaded AuthKey_XXXX.p8 file
#   IOS_DIST_CERT_P12      — base64 of the Apple Distribution .p12 (cert + private key)
#   IOS_DIST_CERT_PASSWORD — the password the .p12 was exported with
#   IOS_PROVISIONING_PROFILE — base64 of the downloaded .mobileprovision file
#   VITE_SUPABASE_URL      — your Supabase project URL (Supabase → Settings → API)
#   VITE_SUPABASE_ANON_KEY — the project's anon/public key (same page)
#   VITE_REVENUECAT_IOS_KEY — RevenueCat → Project → API Keys → the "Apple App
#                             Store" public app key (starts with "appl_")
# Optional:
#   VITE_SITE_BASE         — only needed if the privacy/support/terms pages move.
#                             They're published at the base baked into
#                             src/lib/links.js (currently
#                             https://www.jinnieoclock.com/whatsmypick), which is
#                             what the in-app links and the App Store Connect
#                             privacy URL use. Set this secret to override that
#                             base — include the full path, not just the domain.
#
# Signing is fully MANUAL and explicit: a real Distribution certificate is
# imported into a CI keychain and a real App Store provisioning profile is
# installed. The signing identity/style/profile live in project.pbxproj's
# App target (Release config) rather than as xcodebuild CLI overrides —
# CLI KEY=VALUE overrides apply build-wide to every target, including
# dependency targets like RevenueCat's SPM resource bundle, which can't
# carry a provisioning profile at all and fails the build if one is
# forced onto it. Baking the settings into just the App target's own
# config scopes them correctly. The API key is used for the final upload.
#
# Before the first run, in the browser:
#   1. developer.apple.com → Identifiers → register bundle ID com.whatsmypick.app
#      (enable the "Sign in with Apple" capability on it)
#   2. App Store Connect → Apps → "+" → New App → pick that bundle ID

name: iOS · TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web app and sync into the iOS project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          # Optional override for where the privacy/support/terms pages are
          # published. Unset is fine — links.js carries the correct base.
          VITE_SITE_BASE: ${{ secrets.VITE_SITE_BASE }}
          # Optional — crash reporting. Leave the secret unset and the build
          # ships zero Sentry code (see src/main.jsx).
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          npm ci
          npm run ios

      - name: Write App Store Connect API key
        env:
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPSTORE_P8" > "$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8"

      - name: Import Distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_UUID=$(echo "$PROFILE_PLIST" | plutil -extract UUID raw -)
          PROFILE_NAME=$(echo "$PROFILE_PLIST" | plutil -extract Name raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"
          # The archive is built unsigned, so the shipped app's entitlements
          # come from THIS profile — a stale one silently strips iCloud and
          # the backup feature dies without any build error. Fail loudly
          # instead: after enabling a capability on the App ID, regenerate
          # the profile and update the IOS_PROVISIONING_PROFILE secret.
          if ! echo "$PROFILE_PLIST" | plutil -extract 'Entitlements.com\.apple\.developer\.ubiquity-kvstore-identifier' raw - >/dev/null 2>&1; then
            echo "::error::Provisioning profile '$PROFILE_NAME' lacks the iCloud key-value entitlement. Tick iCloud on the App ID (developer.apple.com), regenerate + re-download the App Store profile, and update the IOS_PROVISIONING_PROFILE secret with its base64."
            exit 1
          fi

      # SIGNED archive — this is load-bearing for entitlements. An unsigned
      # archive gets its entitlements reconstructed from the provisioning
      # profile at export, and the profile carries iCloud's kv-store id as a
      # wildcard (TEAMID.*) which iOS rejects at runtime — backups silently
      # died that way. Signing here makes Xcode process App/App.entitlements
      # and embed the concrete value. The manual signing identity/profile
      # live in the App target's Release config in project.pbxproj (scoped
      # there, not as CLI overrides, which would leak onto SPM resource
      # bundle targets that can't carry a profile).
      - name: Archive (signed with the installed profile)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="1.0"
          # Verify the archived app really carries the concrete kv-store
          # entitlement before spending time on export/upload.
          APP_PATH="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if ! codesign -d --entitlements - "$APP_PATH" 2>/dev/null | grep -q "ubiquity-kvstore-identifier"; then
            echo "::error::Archived app is missing the iCloud kv-store entitlement — check App.entitlements and the profile."
            exit 1
          fi
          # Push notifications (LAUNCH-2): without aps-environment the app never
          # gets an APNs token and notify-turn silently sends nothing. Fail loudly
          # if the capability didn't make it into the signed app — tick Push
          # Notifications on the App ID and regenerate the provisioning profile.
          if ! codesign -d --entitlements - "$APP_PATH" 2>/dev/null | grep -q "aps-environment"; then
            echo "::error::Archived app is missing the aps-environment (push) entitlement. Enable Push Notifications on the App ID (developer.apple.com), regenerate + re-download the App Store profile, and update the IOS_PROVISIONING_PROFILE secret."
            exit 1
          fi
          codesign -d --entitlements - "$APP_PATH" 2>/dev/null | grep -A1 "ubiquity\|aps-environment" || true

      - name: Export and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.whatsmypick.app</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
